name: Buat Keystore Android (sekali saja)
on: workflow_dispatch

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Buat, enkripsi, dan simpan keystore
        run: |
          [ ! -f keystore/uangq.jks.gpg ] || { echo "::error::Keystore sudah ada. Jangan dibuat ulang, nanti APK lama tidak bisa di-update."; exit 1; }
          [ "${#KS_PASS}" -ge 16 ] || { echo "::error::Secret KEYSTORE_PASSPHRASE belum diisi atau kurang dari 16 karakter"; exit 1; }
          mkdir -p keystore
          keytool -genkeypair -keystore uangq.jks -storetype PKCS12 -alias uangq \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass:env KS_PASS -dname "CN=UangQ, O=UangQ, C=ID"
          echo "$KS_PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o keystore/uangq.jks.gpg uangq.jks
          rm -f uangq.jks
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add keystore/uangq.jks.gpg
          git commit -m "Tambah keystore Android terenkripsi"
          git push
