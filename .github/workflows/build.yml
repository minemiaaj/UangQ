name: Build APK & EXE
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with: { name: windows-exe, path: dist/*.exe }

  android-apk:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.3.${{ github.run_number }}
      SECURE_SCREEN: "true"   # ubah ke "false" jika ingin bisa screenshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Siapkan keystore penandatangan
        run: |
          [ -n "$KS_PASS" ] || { echo "::error::Secret KEYSTORE_PASSPHRASE belum diisi (Settings > Secrets and variables > Actions)"; exit 1; }
          [ -f keystore/uangq.jks.gpg ] || { echo "::error::Keystore belum ada. Jalankan dulu workflow 'Buat Keystore Android'"; exit 1; }
          echo "$KS_PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 -d -o "$RUNNER_TEMP/uangq.jks" keystore/uangq.jks.gpg

      - run: npm install
      - run: npx cap add android
      - name: Buat ikon & splash Android dari folder assets/
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b1220' --iconBackgroundColorDark '#0b1220' --splashBackgroundColor '#0b1220' --splashBackgroundColorDark '#0b1220'
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Tanda tangani APK (v1+v2+v3)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/uangq.jks" --ks-key-alias uangq --ks-pass env:KS_PASS --out UangQ.apk aligned.apk
          "$BT/apksigner" verify --print-certs UangQ.apk

      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: UangQ.apk }
